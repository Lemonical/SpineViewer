name-template: v$RESOLVED_VERSION
tag-template: v$RESOLVED_VERSION
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'
no-changes-template: "- No user-facing changes in this cycle."
template: |
  ## What's Changed

  $CHANGES

  ## Contributors

  $CONTRIBUTORS

categories:
  - title: Features
    labels:
      - feature
      - enhancement
  - title: Fixes
    labels:
      - fix
      - bug
      - bugfix
  - title: Maintenance
    labels:
      - chore
      - ci
      - dependencies
  - title: Documentation
    labels:
      - docs

exclude-labels:
  - skip-changelog

version-resolver:
  major:
    labels:
      - major
      - breaking
  minor:
    labels:
      - feature
      - enhancement
  patch:
    labels:
      - fix
      - bug
      - bugfix
      - chore
      - ci
      - dependencies
      - docs
  default: patch
