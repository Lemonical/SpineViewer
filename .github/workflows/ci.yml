name: CI

on:
  push:
    branches:
      - main
      - master
      - v2
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore SpineViewer.slnx

      - name: Run solution tests
        run: dotnet test SpineViewer.slnx --configuration Release --no-restore

      - name: Run rewrite smoke test
        run: dotnet run --project src/SpineViewer.Desktop/SpineViewer.Desktop.csproj --configuration Release --no-restore -- --smoke-test
